name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vpi_test
          POSTGRES_PASSWORD: vpi_test
          POSTGRES_DB: vpi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vpi_test -d vpi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_DATABASE_URL: postgresql+asyncpg://vpi_test:vpi_test@localhost:5432/vpi_test
      DATABASE_URL: sqlite+aiosqlite:///./migration-ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and dev dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run lint and formatting checks
        run: |
          ruff check vpi_bot tests migrations
          ruff format --check vpi_bot tests migrations
      - name: Run SQLite migrations
        run: python -m alembic upgrade head
      - name: Run tests including PostgreSQL concurrency
        run: pytest -q
      - name: Compile Python modules
        run: python -m compileall -q vpi_bot tests migrations
